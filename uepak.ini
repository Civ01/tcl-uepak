; UE PAK packer plugin options.
; Edited copy is used from the plugin folder if it is writable,
; otherwise from the folder of wincmd.ini.

[Options]
; Folder = mount point (without leading ../) shown as top-level folders (default)
; Root   = pak contents shown relative to its mount point
MountPoint=Folder

; Folder view: extra attributes on the mount point's folders, so TC can show
; them differently from the pak's real folders.
;   ReadOnly (default) - add a TC colour rule: Directory + Read only
;   Hidden             - TC dims them automatically when "show hidden files" is on
;                        (they disappear if hidden files are not shown)
;   System, combinations (ReadOnly,Hidden), or None
MountFolderAttr=ReadOnly

; 1 = write a detailed diagnostic log to uepak.log in the plugin folder.
; If that folder is not writable, the log is kept in memory and copied to
; the clipboard whenever an operation fails. Leave at 0 normally.
DebugLog=0
