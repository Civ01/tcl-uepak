; UE PAK packer plugin options.
; Edited copy is used from the plugin folder if it is writable,
; otherwise from the folder of wincmd.ini.

[Options]
; Folder = mount point (without leading ../) shown as top-level folders (default)
; Root   = pak contents shown relative to its mount point
MountPoint=Folder

; Folder view: extra attributes on the mount point's folders, so TC can show
; them differently from the pak's real folders.
;   Hidden (default) - TC draws them dimmed when "show hidden/system files" is on
;                      (they disappear if hidden files are not shown)
;   ReadOnly         - for a TC colour rule
;   System, combinations (ReadOnly,Hidden), or None
MountFolderAttr=Hidden

; 1 = write a detailed diagnostic log to uepak.log in the plugin folder.
; If that folder is not writable, the log is kept in memory and copied to
; the clipboard whenever an operation fails. Leave at 0 normally.
DebugLog=0

[Pack]
; Packing settings (the Configure button in TC's pack dialog edits them).
; New paks use all of them; existing paks keep their own version and mount point.
; Mount point: where the packed files appear in the game. Packed paths are
; relative to the selected files, e.g. MountPoint=../../../Townfall/Config/
; + Engine.ini -> Townfall/Config/Engine.ini
MountPoint=../../../
; V12 (UE 5.3+), V11 (UE 4.26-5.x, default), V10, V9 (4.25), V8B (4.23-4.24),
; V8A (4.22), V7 (4.21), V5 (4.20), V4 (4.16-4.19), V3 (4.3-4.15)
Version=V11
; None | Zlib | Gzip | Oodle | Zstd | LZ4
; Oodle needs oo2core_N_win64.dll in deps\. Zstd and LZ4 are only read by games
; built with them (LZ4/Zstd need V8A+). Files that don't shrink are stored raw.
Compression=None
; Uncompressed bytes per compression block: 64K (UnrealPak default), 124K is the
; largest size older engines can read; up to 64M accepted.
BlockSize=64K
; Level for the chosen method; empty = default.
;   Zlib/Gzip 0-9 (default 1), Zstd 1-22 (default 3),
;   Oodle HyperFast4..HyperFast1, SuperFast, VeryFast, Fast, Normal (default), Optimal1..Optimal5
Level=
; Oodle only: Kraken | Mermaid (default, UE's default) | Selkie | Leviathan | Hydra
OodleCompressor=Mermaid
